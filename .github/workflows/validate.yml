name: Kontrola

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Co testy potřebují: PyYAML (ověřují vygenerovaný YAML karty),
      # dateutil (opakovaná událost v plánu), voluptuous (schémata
      # nastavení v náhradě za Home Assistant). Samotný pytest nestačí —
      # na tom tenhle krok poprvé spadl.
      - run: pip install pytest pyyaml python-dateutil voluptuous
      - run: python -m pytest tests -q
      # kontrola celistvosti balíčku: entity v kartě, verze v manifestu,
      # zakázané vzory. Chyba se má ukázat tady, ne až v bytě.
      - run: python kontrola.py
